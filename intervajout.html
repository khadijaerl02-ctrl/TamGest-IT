<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <title>Ajouter une interventions</title>
    <link rel="icon" type="image/png" href="logo_TamGestIT.png">
</head>

<body>
    <div class="content">
            <aside class="sidebar">
            
                <div class="logo">
                    <img src="logo_TamGestIT.png" alt="TamGest Logo">
                    <h2>TamGest IT</h2>
                </div>
            
                <ul class="menu">
            
                    <li>
                        <a href="index.html">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Tableau de Bord</span>
                        </a>
                    </li>
            
                    <li class="menu-item">
                        <a href="#">
                            <i class="fa-solid fa-desktop"></i>
                            <span>Équipements</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </a>
            
                        <ul class="submenu">
                            <li>
                                <a href="equipement.html">
                                    <i class="fa-solid fa-list"></i> Liste
                                </a>
                            </li>
            
                            <li>
                                <a href="ajouter-equipement.html">
                                    <i class="fa-solid fa-plus"></i> Ajouter
                                </a>
                            </li>
                        </ul>
                    </li>
            
                    <li class="menu-item">
                        <a href="#">
                            <i class="fa-solid fa-users"></i>
                            <span>Utilisateurs</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </a>
            
                        <ul class="submenu">
                            <li>
                                <a href="listeuser.html">
                                    <i class="fa-solid fa-list"></i> Liste
                                </a>
                            </li>
            
                            <li>
                                <a href="utilisateur.html">
                                    <i class="fa-solid fa-plus"></i> Ajouter
                                </a>
                            </li>
                        </ul>
                    </li>
            
            
                    <li class="menu-item active-menu">
                        <a href="#">
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                            <span>Interventions</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </a>
            
                        <ul class="submenu">
                            <li>
                                <a href="intervliste.html">
                                    <i class="fa-solid fa-list"></i> Liste
                                </a>
                            </li>
            
                            <li>
                                <a href="intervajout.html" class="active">
                                    <i class="fa-solid fa-plus"></i> Ajouter
                                </a>
                            </li>
                        </ul>
                    </li>
            
                </ul>
            
                <div class="logout-container">
                    <a href="#" id="btnDeconnexion">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            
            </aside>
        <main class="main-content">
            <main class="main-content">
            
                <div class="form-card">
            
                    <div class="form-header">
                        <h2>
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                            Ajouter une intervention
                        </h2>
            
                        <p>
                            Enregistrez une nouvelle intervention informatique.
                        </p>
                    </div>
            
                    <form id="interventionForm">
            
                        <div class="form-grid">
            
                            <div class="form-group">
                                <label for="titre">Titre</label>
                                <input type="text" id="titre" placeholder="Ex : Remplacement du SSD">
                            </div>
            
                            <div class="form-group">
                                <label for="type">Type d'intervention</label>
                                <select id="type">
                                    <option>Maintenance</option>
                                    <option>Réparation</option>
                                    <option>Installation</option>
                                    <option>Configuration</option>
                                    <option>Mise à jour</option>
                                    
                                </select>
                            </div>
            
                            <div class="form-group">
                                <label for="equipement">Équipement concerné</label>
                                <input type="text" id="equipement">
                            </div>
            
                            <div class="form-group">
                                <label for="technicien">Technicien</label>
                                <input type="text" id="technicien" placeholder="Nom du technicien">
                            </div>
            
                            <div class="form-group">
                                <label for="utilisateur">Utilisateur concerné</label>
                                <input type="text" id="utilisateur" placeholder="Nom de l'utilisateur">
                            </div>
            
                            <div class="form-group">
                                <label for="departement">Département</label>
                                <select id="departement">
                                    <option>Informatique</option>
                                    <option>RH</option>
                                    <option>Comptabilité</option>
                                    <option>Commercial</option>
                                </select>
                            </div>
            
                            
            
                            <div class="form-group">
                                <label for="statut">Statut</label>
                                <select id="statut">
                                    <option>En attente</option>
                                    <option>En cours</option>
                                    <option>Terminée</option>
                                    <option >Annulée</option>
                                </select>
                            </div>
            
                            <div class="form-group">
                                <label for="date">Date d'intervention</label>
                                <input type="date" id="date">
                            </div>
            
                            <div class="form-group">
                                <label for="duree">Durée estimée</label>
                                <input type="text" id="duree" placeholder="Ex : 2 heures">
                            </div>
            
                        </div>
            
                        <div class="form-group full-width">
                            <label for="probleme">Description du problème</label>
                            <textarea id="probleme" rows="5" placeholder="Décrivez le problème rencontré..."></textarea>
                        </div>
            
                        <div class="form-group full-width">
                            <label for="solution">Solution apportée</label>
                            <textarea id="solution" rows="5" placeholder="Décrivez la solution appliquée..."></textarea>
                        </div>
            
                        <div class="buttons">
            
                            <button type="reset" class="cancel">
                                Annuler
                            </button>
            
                            <button type="submit" class="save">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Enregistrer
                            </button>
            
                        </div>
            
                    </form>
            
                </div>
            
            </main>

        </main>

    </div>
    <script src="sidebar.js"></script>
    <script src="script.js"></script>
    <script src="interventions.js"></script>
    <script src="protection.js"></script>
</body>

</html>
